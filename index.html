  <title>Frontend Mentor | Recipe page</title>

  <style>
  * {
    margin: 0;

  .page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: hsl(30, 25%, 94%);
    padding: 20px;
  }

  /* البطاقة البيضاء */
  .recipe-card {
    background-color: hsl(250, 30%, 92%);
    border-radius: 20px;
    max-width: 650px;
    width: 100%;
    overflow: hidden;   /* مهم جداً! يقص الصورة حسب زوايا البطاقة */
  }

  /* الصورة أعلى البطاقة */
  .recipe-image {
    display: block;       /* يزيل الفراغ أسفل الصورة */
    width: 100%;          /* تملأ عرض البطاقة */
    height: auto;
    border-radius: 12px;
    margin: 20px;         /* هامش حول الصورة */
    max-width: calc(100% - 40px);
  }

  .content {
    padding: 0 30px 30px;
  }
  </style>
  
</head>
<body>

 <main class="page">
    <article class="recipe-card">

</body>

<h1>Simple Omelette Recipe</h1> 

  <p>An easy and quick dish, perfect for any meal. This classic omelette combines beaten eggs cooked

  Preparation time

  Total: Approximately 10 minutes
  Preparation: 5 minutes
  Cooking: 5 minutes

  Ingredients

  2-3 large eggs
  Salt, to taste
  Pepper, to taste
  1 tablespoon of butter or oil
  Optional fillings: cheese, diced vegetables, cooked meats, herbs

  Instructions

  Beat the eggs: In a bowl, beat the eggs with a pinch of salt and pepper until they are well mixed. 
  You can add a tablespoon of water or milk for a fluffier texture.

  Heat the pan: Place a non-stick frying pan over medium heat and add butter or oil.

  Cook the omelette: Once the butter is melted and bubbling, pour in the eggs. Tilt the pan to ensure 
  the eggs evenly coat the surface.

  Add fillings (optional): When the eggs begin to set at the edges but are still slightly runny in the 
  middle, sprinkle your chosen fillings over one half of the omelette.

  Fold and serve: As the omelette continues to cook, carefully lift one edge and fold it over the 
  fillings. Let it cook for another minute, then slide it onto a plate.

  Enjoy: Serve hot, with additional salt and pepper if needed.
