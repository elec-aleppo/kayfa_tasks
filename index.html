<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css"> 
  <title>Frontend Mentor | Results summary component</title>

 
</head>
<body>
   <div class="container">
    <div class="card">

     <div class="Result">
      <h1> Your Result</h1>
        <div class="Mark">
        <span class="value">76</span>
        <span class="max">of 100</span>
        </div>
      <p class="title-result">Great</p>
     <p class="comment"> You scored higher than 65% of the people who have taken these tests.</p>
     </div>

    <div class="Summary">
       <h2>Summary</h2>
           <div class="summary-reaction">
           
           <div class="icon-reaction">
             <img src="./assets/images/icon-reaction.svg" alt="Reaction icon">
             <span class="name-reaction">Reaction</span>
           </div>

           <div class="mark-reaction">
             <span class="score">80</span>
             <span class="total">/ 100</span>
           </div>
           
           </div>

           <div class="summary-Memory">

           <div class="icon-Memory">
             <img src="./assets/images/icon-memory.svg" alt="Memory icon">
             <span class="name-Memory">Memory</span>
           </div>

           <div class="mark-Memory">
             <span class="score">92</span>
             <span class="total">/ 100</span>
           </div>
           

           </div>

           <div class="summary-Verbal">

           <div class="icon-Verbal"> 
             <img src="./assets/images/icon-verbal.svg" alt="Verbal icon" >

             <span class="name-Verbal">Verbal</span>
           </div>

           <div class="mark-Verbal">
             <span class="score">61</span>
             <span class="total">/ 100</span>
           </div>
           

           </div>

            <div class="summary-Visual">

           <div class="icon-Visual">
             <img src="./assets/images/icon-visual.svg" alt="Visual icon" >
             <span class="name-Visual">Visual</span>
           </div>

           <div class="mark-Visual">
             <span class="score">73</span>
             <span class="total">/ 100</span>
           </div>
           

            </div>
            
            <div class="Continue">
              <h2>Continue</h2>
            </div>



    </div>
   </div>
   </div>
</body>
</html>
